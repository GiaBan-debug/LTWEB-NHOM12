<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Đăng nhập · BTA STORE</title>
    <link rel="stylesheet" href="../assets/css/store.css" />
    <link rel="stylesheet" href="../assets/css/auth.css" />
  </head>
  <body>
    <div class="announcement">BTA STORE · TÀI KHOẢN CỦA BẠN</div>
    <header class="site-header" data-site-header></header>
    <main class="auth-page">
      <form id="login-form" class="auth-card" novalidate>
        <h1>Đăng nhập</h1>
        <p class="auth-lead">Đăng nhập bằng số điện thoại và mã OTP hoặc tiếp tục bằng Google.</p>
        <div id="auth-status" class="auth-status" role="status" aria-live="polite" hidden></div>
        <button
          id="btn-google"
          class="button secondary"
          type="button"
          style="width: 100%; margin-bottom: 20px"
        >
          Đăng nhập bằng Google
        </button>
        <fieldset
          id="phone-fields"
          style="border: 0; margin: 0; padding: 0"
        >
          <label class="auth-field"
            >Số điện thoại
            <input
              id="phone"
              name="phone"
              type="tel"
              autocomplete="tel" inputmode="tel" maxlength="25" placeholder="0912 345 678"
              required
            />
            <small class="field-error" data-error-for="phone"></small>
          </label>
          <button id="btn-submit" class="btn-auth" type="submit">
            Đăng nhập
          </button>
        </fieldset>
        <p class="auth-alt">
          Chưa có tài khoản? <a href="register.html">Đăng ký</a>
        </p>
      </form>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="../assets/js/shop.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/phone-auth-page.js"></script>
  </body>
</html>
