<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="BTA STORE — cửa hàng điện thoại, laptop và phụ kiện công nghệ."
    />
    <title>Thông tin cá nhân · BTA STORE</title>
    <link rel="stylesheet" href="../../assets/css/store.css" />
    <script src="../../assets/js/shop.js" defer></script>
    <script src="../../assets/js/auth.js" defer></script>
    <script src="../../assets/js/main.js" defer></script>
    <script src="../../assets/js/store.js" defer></script>
  </head>
  <body data-view="profile">
    <div class="announcement">
      BTA STORE · KHÁM PHÁ CÔNG NGHỆ THEO CÁCH CỦA BẠN
    </div>
    <header class="site-header" data-site-header></header>
    <main class="shell">
      <div class="narrow">
        <span class="eyebrow">TÀI KHOẢN CỦA BẠN</span>
        <h1>Thông tin cá nhân</h1>
        <form class="panel" id="profile-form">
          <label class="field"
            >Họ và tên<input
              name="name"
              type="text"
              required
              maxlength="100"
              autocomplete="name" /><small
              class="field__error"
              data-error-for="name"
            ></small></label
          >          <label class="field"
            >Email đăng nhập<input name="email" type="email" readonly
          /></label>
          <label class="field"
            >Số điện thoại<input
              name="phone"
              type="tel"
              autocomplete="tel"
              maxlength="30"
          /></label>
          <label class="field"
            >Địa chỉ nhận hàng mặc định<input
              name="address"
              autocomplete="street-address"
              maxlength="255"
          /></label>
          <p class="subtle">
            Email dùng để đăng nhập và được giữ cố định trong bản demo.
          </p>
          <label class="field"
            >Số điện thoại<input
              name="phone"
              type="tel"
              maxlength="25"
              autocomplete="tel"
              placeholder="0912 345 678" /><small
              class="field__error"
              data-error-for="phone"
            ></small></label
          ><label class="field"
            >Địa chỉ nhận hàng mặc định<input
              name="address"
              maxlength="255"
              autocomplete="street-address" /><small
              class="field__error"
              data-error-for="address"
            ></small></label>
          <p class="subtle">
            Điện thoại và địa chỉ này được điền sẵn khi đặt hàng. Bạn vẫn có thể
            sửa riêng cho từng đơn mà không đổi hồ sơ.
          </p>
          <div id="profile-status" role="status"></div>
          <button class="button">Lưu thông tin</button>
          <a class="button secondary" href="order-history.html">Xem đơn hàng</a>
        </form>
      </div>
    </main>
    <footer class="site-footer" data-site-footer></footer>
  </body>
</html>
