<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quên mật khẩu · BTA Store</title>
    <link rel="stylesheet" href="../assets/css/store.css" />
    <link rel="stylesheet" href="../assets/css/auth.css" />
  </head>
  <body>
    <header class="site-header" data-site-header></header>
    <main class="auth-page">
      <form id="reset-form" class="auth-card">
        <h1>Đặt lại mật khẩu</h1>
        <p class="auth-lead">
          Nhập email đăng ký. Chúng tôi sẽ gửi hướng dẫn đặt lại mật khẩu nếu
          tài khoản phù hợp.
        </p>
        <label class="auth-field"
          >Email<input
            name="email"
            type="email"
            autocomplete="email"
            required
            maxlength="150"
        /></label>
        <div id="auth-status" class="auth-status" role="status" hidden></div>
        <button class="btn-auth">Gửi hướng dẫn</button>
        <p class="auth-alt"><a href="login.html">← Quay lại đăng nhập</a></p>
      </form>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="../assets/js/shop.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
      document
        .querySelector("#reset-form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const form = event.currentTarget,
            button = form.querySelector("button"),
            status = document.querySelector("#auth-status");
          button.disabled = true;
          try {
            await Auth.resetPassword(form.elements.email.value.trim());
            Auth.setStatus(
              status,
              "Nếu email có tài khoản, hướng dẫn đặt lại mật khẩu sẽ được gửi. Hãy kiểm tra cả thư rác.",
              "ok",
            );
          } catch (error) {
            Auth.setStatus(status, error.message, "error");
          } finally {
            button.disabled = false;
          }
        });
    </script>
  </body>
</html>
