<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Đăng ký · BTA STORE</title>
    <link rel="stylesheet" href="../assets/css/store.css" />
    <link rel="stylesheet" href="../assets/css/auth.css" />
  </head>
  <body>
    <div class="announcement">BTA STORE · TÀI KHOẢN CỦA BẠN</div>
    <header class="site-header" data-site-header></header>
    <main class="auth-page">
      <form id="register-form" class="auth-card" novalidate>
        <h1>Đăng ký</h1>
        <p class="auth-lead">
          Tạo tài khoản để mua hàng. Mật khẩu không lưu trên trình duyệt.
        </p>
        <div id="auth-status" class="auth-status" hidden></div>
        <button
          id="btn-google"
          class="button secondary"
          type="button"
          style="width: 100%; margin-bottom: 20px"
        >
          Tiếp tục bằng Google
        </button>
        <fieldset
          id="email-password-fields"
          style="border: 0; margin: 0; padding: 0"
        >
          <label class="auth-field"
            >Họ và tên
            <input
              id="name"
              name="name"
              type="text"
              autocomplete="name"
              maxlength="100"
              required
            />
            <small class="field-error" data-error-for="name"></small>
          </label>
          <label class="auth-field"
            >Email
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
            <small class="field-error" data-error-for="email"></small>
          </label>
          <label class="auth-field"
            >Mật khẩu
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="6"
              required
            />
            <small class="field-error" data-error-for="password"></small>
          </label>
          <label class="auth-field"
            >Xác nhận mật khẩu
            <input
              id="password2"
              name="password2"
              type="password"
              autocomplete="new-password"
              minlength="6"
              required
            />
            <small class="field-error" data-error-for="password2"></small>
          </label>
          <button id="btn-submit" class="btn-auth" type="submit">
            Đăng ký
          </button>
        </fieldset>
        <p class="auth-alt">
          Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </p>
      </form>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="../assets/js/shop.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const form = document.getElementById("register-form");
        const statusEl = document.getElementById("auth-status");
        const btn = document.getElementById("btn-submit");
        const googleButton = document.querySelector("#btn-google");
        googleButton.addEventListener("click", async () => {
          googleButton.disabled = true;
          try {
            await Auth.googleLogin();
            location.href = Auth.homeHref;
          } catch (error) {
            Auth.setStatus(statusEl, error.message, "error");
            googleButton.disabled = false;
          }
        });
        Auth.setupAuthPage(googleButton, statusEl);
        let user;
        try {
          user = await Auth.currentUser();
        } catch (error) {
          Auth.setStatus(statusEl, error.message, "error");
        }
        if (user) {
          location.replace(Auth.homeHref);
          return;
        }

        const setFieldError = (name, message) => {
          const small = form.querySelector('[data-error-for="' + name + '"]');
          const field = small && small.closest(".auth-field");
          if (small) small.textContent = message || "";
          if (field) field.classList.toggle("is-invalid", Boolean(message));
        };

        form.addEventListener("submit", async (ev) => {
          ev.preventDefault();
          ["name", "email", "password", "password2"].forEach((n) =>
            setFieldError(n, ""),
          );
          Auth.setStatus(statusEl, "");

          const name = String(form.name.value).trim();
          const email = String(form.email.value).trim();
          const password = String(form.password.value);
          const password2 = String(form.password2.value);
          let invalid = false;
          if (name.length < 2) {
            setFieldError("name", "Vui lòng nhập họ tên.");
            invalid = true;
          }
          if (!Auth.emailRe.test(email)) {
            setFieldError("email", "Email không hợp lệ.");
            invalid = true;
          }
          if (password.length < 6) {
            setFieldError("password", "Mật khẩu phải ít nhất 6 ký tự.");
            invalid = true;
          }
          if (password !== password2) {
            setFieldError("password2", "Mật khẩu xác nhận không khớp.");
            invalid = true;
          }
          if (invalid) return;

          btn.disabled = true;
          btn.textContent = "Đang đăng ký…";
          try {
            const result = await Auth.register({ name, email, password });
            const configuration = await Auth.config();
            sessionStorage.setItem(
              "auth_registration_notice",
              configuration.mode === "firebase"
                ? result.emailSent
                  ? "Đã tạo tài khoản. Hãy kiểm tra email (kể cả thư rác) để xác minh, sau đó đăng nhập."
                  : "Đã tạo tài khoản. Đăng nhập và chọn Xác minh email để gửi lại thư."
                : "Đăng ký thành công. Bạn có thể đăng nhập.",
            );
            Auth.setStatus(
              statusEl,
              "Đăng ký thành công. Đang chuyển sang đăng nhập…",
              "ok",
            );
            location.href = "login.html";
          } catch (e) {
            Auth.setStatus(statusEl, e.message, "error");
            btn.disabled = false;
            btn.textContent = "Đăng ký";
          }
        });
      });
    </script>
  </body>
</html>
