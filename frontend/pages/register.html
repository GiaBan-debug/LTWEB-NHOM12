<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Đăng ký · BTA STORE</title>
    <link rel="stylesheet" href="../assets/css/store.css" />
    <link rel="stylesheet" href="../assets/css/auth.css" />
  </head>
  <body>
    <div class="announcement">BTA STORE · TÀI KHOẢN CỦA BẠN</div>
    <header class="site-header" data-site-header></header>
    <main class="auth-page">
      <form id="register-form" class="auth-card" novalidate>
        <h1>Đăng ký</h1>
        <p class="auth-lead">Tạo tài khoản bằng số điện thoại hoặc tiếp tục bằng Google.</p>
        <div id="auth-status" class="auth-status" role="status" aria-live="polite" hidden></div>
        <button
          id="btn-google"
          class="button secondary"
          type="button"
          style="width: 100%; margin-bottom: 20px"
        >
          Tiếp tục bằng Google
        </button>
        <fieldset
          id="phone-fields"
          style="border: 0; margin: 0; padding: 0"
        >
          <label class="auth-field"
            >Số điện thoại
            <input
              id="phone"
              name="phone"
              type="tel"
              autocomplete="tel" inputmode="tel" maxlength="25" placeholder="0912 345 678"
              required
            />
            <small class="field-error" data-error-for="phone"></small>
          </label>
          <button id="btn-submit" class="btn-auth" type="submit" disabled>
            Đăng ký
          </button>
        </fieldset>
        <section id="otp-step" hidden aria-labelledby="otp-title">
          <h2 id="otp-title">Xác nhận số điện thoại</h2>
          <p>Số điện thoại: <strong id="otp-phone"></strong></p>
          <p class="auth-note">Chưa gửi mã OTP. Xác thực SMS hiện chưa khả dụng; tài khoản chưa được tạo.</p>
          <label class="auth-field">Mã OTP
            <input id="otp-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Nhập 6 chữ số" />
          </label>
          <button class="btn-auth" type="button" disabled>Xác nhận OTP (chưa khả dụng)</button>
          <button id="otp-back" class="button secondary" type="button">Quay lại</button>
        </section>
        <p class="auth-alt">
          Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </p>
      </form>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="../assets/js/shop.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/phone-auth-page.js"></script>
  </body>
</html>
