<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng ký — SHOP DEMO</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/header.css" />
    <link rel="stylesheet" href="../assets/css/auth.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="topbar">
          <a class="brand" href="../index.html">
            <img src="../assets/images/logo1.avif" alt="Logo" />
            <h2 class="namelogo">SHOP DEMO</h2>
          </a>
          <nav class="Menu">
            <a href="../index.html">Trang chủ</a>
            <div id="auth-area" class="auth-area"></div>
          </nav>
        </div>
      </header>
    </div>

    <main class="auth-page">
      <form id="register-form" class="auth-card" novalidate>
        <h1>Đăng ký</h1>
        <p class="auth-lead">Tạo tài khoản để mua hàng. Mật khẩu không lưu trên trình duyệt.</p>
        <div id="auth-status" class="auth-status" hidden></div>
        <label class="auth-field"
          >Họ và tên
          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            maxlength="100"
            required
          />
          <small class="field-error" data-error-for="name"></small>
        </label>
        <label class="auth-field"
          >Email
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
          <small class="field-error" data-error-for="email"></small>
        </label>
        <label class="auth-field"
          >Mật khẩu
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
          />
          <small class="field-error" data-error-for="password"></small>
        </label>
        <label class="auth-field"
          >Xác nhận mật khẩu
          <input
            id="password2"
            name="password2"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
          />
          <small class="field-error" data-error-for="password2"></small>
        </label>
        <button id="btn-submit" class="btn-auth" type="submit">Đăng ký</button>
        <p class="auth-alt">
          Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </p>
      </form>
    </main>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const form = document.getElementById("register-form");
        const statusEl = document.getElementById("auth-status");
        const btn = document.getElementById("btn-submit");
        const user = await Auth.currentUser();
        if (user) {
          location.replace(Auth.homeHref);
          return;
        }

        const setFieldError = (name, message) => {
          const small = form.querySelector('[data-error-for="' + name + '"]');
          const field = small && small.closest(".auth-field");
          if (small) small.textContent = message || "";
          if (field) field.classList.toggle("is-invalid", Boolean(message));
        };

        form.addEventListener("submit", async (ev) => {
          ev.preventDefault();
          ["name", "email", "password", "password2"].forEach((n) => setFieldError(n, ""));
          Auth.setStatus(statusEl, "");

          const name = String(form.name.value).trim();
          const email = String(form.email.value).trim();
          const password = String(form.password.value);
          const password2 = String(form.password2.value);
          let invalid = false;
          if (name.length < 2) {
            setFieldError("name", "Vui lòng nhập họ tên.");
            invalid = true;
          }
          if (!Auth.emailRe.test(email)) {
            setFieldError("email", "Email không hợp lệ.");
            invalid = true;
          }
          if (password.length < 6) {
            setFieldError("password", "Mật khẩu phải ít nhất 6 ký tự.");
            invalid = true;
          }
          if (password !== password2) {
            setFieldError("password2", "Mật khẩu xác nhận không khớp.");
            invalid = true;
          }
          if (invalid) return;

          btn.disabled = true;
          btn.textContent = "Đang đăng ký…";
          try {
            await Auth.register({ name, email, password });
            Auth.setStatus(
              statusEl,
              "Đăng ký thành công. Đang chuyển sang đăng nhập…",
              "ok",
            );
            location.href = "login.html";
          } catch (e) {
            Auth.setStatus(statusEl, e.message, "error");
            btn.disabled = false;
            btn.textContent = "Đăng ký";
          }
        });
      });
    </script>
  </body>
</html>
